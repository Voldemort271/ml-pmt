[project]
name = "ml-pmt"
version = "0.1.0"
description = "Predictive mutation-based fault localization"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "libcst",
    "coverage",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["benchmarks", ".venv", "data", "artifacts", ".git"]